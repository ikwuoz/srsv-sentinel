# Deploys web/ (the charter guide) to GitHub Pages on every push to main
# that touches the page or its canonical math source.
name: pages
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/math.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # web/vendor/math.js is gitignored (generated) — rebuild it from src/math.ts
      - run: npm run build:web-math
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
